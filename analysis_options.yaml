# HumSukhan analyzer configuration.
#
# CI runs `flutter analyze --fatal-infos`, so everything the analyzer reports
# here is a build failure. The rules below are not style preferences: each one
# closes a defect class listed in docs/instructions.md §5.1.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # An unhandled stream terminus or a dropped future is how B4 shipped.
    unawaited_futures: error
    discarded_futures: ignore
    # An empty catch is how failures became invisible (B8).
    empty_catches: error
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**

linter:
  rules:
    # Failure handling.
    - empty_catches
    - only_throw_errors
    - avoid_catching_errors
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_void_async
    # Correctness.
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - always_declare_return_types
    - avoid_returning_null_for_void
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - use_build_context_synchronously
    # Clarity.
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_lambdas
    - use_super_parameters
    - sort_child_properties_last
    - avoid_redundant_argument_values

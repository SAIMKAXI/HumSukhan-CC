# An installable APK, on demand.
#
# The gap this fills: CI proves the app compiles, and the Release workflow
# publishes a signed build from a tag. Neither answers "let me put it on a
# phone and try it" without either cutting a release or waiting for one.
#
# Run it from the Actions tab: Test APK → Run workflow.
name: Test APK

on:
  workflow_dispatch:
    inputs:
      backend:
        description: >-
          Include the Supabase backend (accounts, AI summaries). Speech works
          either way — it runs on the device.
        type: boolean
        default: true

# Needed to publish the pre-release below.
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build:
    name: Build an installable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Used when it exists, skipped when it does not. Without it the build
      # falls back to Android's debug key, which installs fine for testing and
      # is refused outright by the Release workflow — the distinction that
      # keeps a test build from being mistaken for a shippable one.
      - name: Restore the signing key, if one is configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "### Test-signed build" >> "$GITHUB_STEP_SUMMARY"
            echo "No keystore is configured, so this APK is signed with \
              Android's debug key. It installs and runs; it cannot be \
              published, and it cannot upgrade a differently-signed install." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=../upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "### Release-signed build" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the APK
        env:
          SUPABASE_URL: ${{ inputs.backend && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: >-
            ${{ inputs.backend && secrets.SUPABASE_ANON_KEY || '' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "backend: **absent** — the app opens on a device account, \
              and captions, speaking and alerts all work" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "backend: present" >> "$GITHUB_STEP_SUMMARY"
          fi
          # --release, not --debug: this is meant to be used, and a debug build
          # is slow enough that live captions would be judged unfairly.
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Check the APK exists and is not empty
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk" || { echo "::error::$apk is missing or empty"; exit 1; }
          echo "built $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Name it after the commit it came from
        id: naming
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml \
            | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          cp build/app/outputs/flutter-apk/app-release.apk \
             "humsukhan-$version-${GITHUB_SHA::7}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Not `v...`: that pattern belongs to the Release workflow, which
          # publishes signed builds only. A test build must not be able to
          # trigger it, or to be mistaken for one of its releases.
          echo "tag=test-$version-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: humsukhan-apk
          path: humsukhan-*.apk
          if-no-files-found: error
          retention-days: 30

      # An artifact lives under Actions and needs a GitHub login to fetch. A
      # release sits on the repository's front page and anyone can download it,
      # which is what "give me a build to try" actually means.
      #
      # Always a pre-release, and titled so the distinction survives being
      # skim-read: this is not the signed build the Release workflow makes.
      - name: Publish it as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.naming.outputs.tag }}
          name: >-
            Test build ${{ steps.naming.outputs.version }}
            (${{ steps.naming.outputs.tag }})
          prerelease: true
          files: humsukhan-*.apk
          fail_on_unmatched_files: true
          body: |
            **A test build. Not a release.**

            Built from `${{ github.sha }}` for trying the app on a phone.

            - **Signed with Android's debug key**, because no upload keystore
              is configured. It installs and runs. It cannot go to Google Play,
              and it cannot upgrade an install signed with a different key —
              uninstall the old one first if an update refuses.
            - **Built ${{ inputs.backend && 'with' || 'without' }} a backend.**
              Speech runs on the device either way: captions, the speak button,
              the language download and sound alerts all work with nothing
              configured. Sign-in and AI summaries are the parts that need a
              server, and they say so rather than failing silently.

            Install by downloading the `.apk` below and opening it on the
            phone, allowing installation from unknown sources when asked.

            The signed, publishable build comes from the Release workflow
            instead, driven by a `v*` tag.

      - name: Clean up the signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

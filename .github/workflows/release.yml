# Tag-driven release.
#
# Refuses to publish unless the tag matches the version in pubspec.yaml and the
# signed APK actually exists and is non-empty. A release that ships nothing, or
# ships a build labelled with someone else's version, is worse than no release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Assert the tag matches the pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "tag=$tag pubspec=$pubspec"
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $pubspec"
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify before building
        run: |
          dart format --set-exit-if-changed lib test integration_test tool
          flutter analyze --fatal-infos
          flutter test

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to \
              publish a debug-signed build"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=../upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build the release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build the app bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Assert the artefacts exist and are not empty
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          for file in "$apk" "$aab"; do
            test -s "$file" || {
              echo "::error::$file is missing or empty"; exit 1; }
            echo "$(basename "$file"): $(du -h "$file" | cut -f1)"
          done
          # A release APK signed with the debug key would install and then fail
          # to update. Refuse it.
          if unzip -p "$apk" META-INF/\*.RSA 2>/dev/null | \
             keytool -printcert 2>/dev/null | grep -qi 'CN=Android Debug'; then
            echo "::error::the release APK is debug-signed"
            exit 1
          fi

      - name: Rename the artefacts for the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "humsukhan-$version.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "humsukhan-$version.aab"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: HumSukhan ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            humsukhan-*.apk
            humsukhan-*.aab
          fail_on_unmatched_files: true

      - name: Clean up the signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
